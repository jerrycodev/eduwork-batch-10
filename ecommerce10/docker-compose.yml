x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Ecommerce10}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Set APP_KEY in Coolify environment variables}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Set APP_URL in Coolify environment variables}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?Set DB_HOST in Coolify environment variables}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in Coolify environment variables}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in Coolify environment variables}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify environment variables}
  SESSION_DRIVER: ${SESSION_DRIVER:-file}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  FILESYSTEM_DISK: public

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment: *app-environment
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - laravel

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *app-environment
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - laravel

volumes:
  laravel_storage:

networks:
  laravel:
    driver: bridge
