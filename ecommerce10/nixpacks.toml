# Coolify / Nixpacks build configuration for Laravel 13 + Vite.
# The PHP provider supplies PHP-FPM + Nginx; the Node provider builds Vite assets.

providers = ["php", "node"]

[variables]
# Laravel must be served from public/, not the repository root.
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

# Vite 8 requires a modern Node runtime.
NIXPACKS_NODE_VERSION = "22"

[phases.install]
# Install only runtime PHP dependencies; Node devDependencies are required for Vite.
cmds = [
    "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan storage:link --force"
]
